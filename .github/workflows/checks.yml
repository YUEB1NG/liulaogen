name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Website and hosting tests
        working-directory: website
        run: python3 -m unittest -v test_api test_device_link test_hosted test_wsgi test_features
  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Firmware repository and host checks
        working-directory: firmware
        run: bash tools/validate.sh --static

name: Feature request / 改进建议
description: Describe a concrete use case / 描述具体使用场景
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: What task is difficult today and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour / 希望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 已尝试的方法
